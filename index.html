<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Technická podpora – VDF Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Technická podpora</h1>
    <p class="subtitle">Jak ti můžeme pomoct? Napiš nám svůj problém.</p>

    <form id="question-form">
      <label for="question">Tvůj dotaz:</label>
      <textarea
        id="question"
        rows="5"
        placeholder="Např.: Po poslední aktualizaci se mi hra nespustí..."
      ></textarea>

      <label for="email">E-mail (nepovinné):</label>
      <input
        type="email"
        id="email"
        placeholder="tvuj@email.cz"
      >

      <button type="submit">Odeslat dotaz</button>
    </form>

    <h2>Odpověď podpory:</h2>
    <div id="answer">
      Zatím žádný dotaz.
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
