<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zákaznická podpora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Zákaznická podpora</h1>
        <p>Napište svůj dotaz a pokusíme se vám pomoci.</p>

        <form id="questionForm">
            <input
                type="text"
                id="question"
                placeholder="Např. Jak dlouho trvá doručení?"
                autocomplete="off"
                required
            >

            <button type="submit">Zeptat se</button>
        </form>

        <div id="answer" class="answer hidden">
            <h2>Odpověď</h2>

            <p id="answerText"></p>

            <div class="employee">
                Odpověděl/a: <strong id="employeeName"></strong>
            </div>
        </div>

        <div id="notFound" class="not-found hidden">
            Bohužel jsme nenašli odpověď na váš dotaz.
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
